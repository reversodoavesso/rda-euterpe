name: Native platforms
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        working-directory: core
        run: rustup show
      - name: Rust formatting
        working-directory: core
        run: cargo fmt --check
      - name: Rust tests
        working-directory: core
        run: cargo test --locked
      - name: Installer tests
        run: node --test app/tests/install-platform.test.mjs
      - name: Build interface
        run: npm ci --prefix app
      - run: npm run build --prefix app
      - name: Native release
        working-directory: core
        run: cargo build --release --locked
      - name: Isolated lifecycle smoke
        run: python tools/smoke-lifecycle.py core/target/release/euterpe
      - uses: actions/upload-artifact@v4
        with:
          name: euterpe-${{ runner.os }}-${{ runner.arch }}
          path: |
            core/target/release/euterpe
            core/target/release/euterpe.exe
          if-no-files-found: error
