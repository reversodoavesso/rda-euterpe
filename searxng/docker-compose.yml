# SearXNG — **opcional** desde o daemon Rust (Fase 5 do PLAN-REFACTOR.md).
#
# O `euterpe.exe` não precisa de Docker: `web_search` cai sozinho na cadeia
#   SearXNG (se SEARXNG_URL responder) → Brave (chave) → Tavily (chave) → DuckDuckGo HTML.
#
# Suba isto apenas se quiser o metabuscador local:
#   cd searxng && docker compose up -d      # http://127.0.0.1:8888
services:
  searxng:
    image: searxng/searxng:latest
    container_name: euterpe-searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
