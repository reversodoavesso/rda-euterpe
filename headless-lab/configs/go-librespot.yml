device_name: Euterpe Headless Lab
device_type: computer
log_level: info
zeroconf_enabled: false
credentials:
  type: device_auth
server:
  enabled: true
  address: 0.0.0.0
  port: 3678
audio_backend: pipe
audio_output_pipe: /tmp/euterpe-headless-audio
audio_output_pipe_wait_for_reader: true
prefer_firewall_friendly_ports: true
metadata:
  enabled: true
  context_sweep: false
  max_tracks: 800
